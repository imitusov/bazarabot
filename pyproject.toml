[project]
name = "zarabot"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["zarabot"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "DTZ", "S", "RET", "SIM"]
# DTZ bans naive datetimes; S catches common security slips; ASYNC catches
# blocking calls on the event loop. All three enforce project rules mechanically
# rather than by review.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert is the point of a test
# The verification suite runs BEFORE the 3.12 environment exists, on whatever
# interpreter the machine has (3.9 on macOS). UP rules would rewrite it to
# syntax that interpreter cannot run - UP017 wants datetime.UTC, which is 3.11+.
# S is ignored because driving subprocesses and urllib is what these scripts are
# for. They are pre-development tooling, not application code.
"scripts/verify/**" = ["UP", "S", "E501"]
"scripts/make_tasks.py" = ["UP", "E501"]
# Host tooling, like scripts/verify: runs on the VPS's system interpreter, and
# driving `docker compose` as a subprocess is the entire purpose, so S603/S607
# flag the intent rather than a risk. E501 is allowed for the SQL literals,
# which are more readable on one line than wrapped.
"scripts/deploy/**" = ["UP", "S603", "S607", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
