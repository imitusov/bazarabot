name: CI

# The deterministic floor. Every gate here is a fact, not a judgement — an
# agent pipeline whose checks are all model opinions has no floor at all.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          pip install -q vendor/t_tech_investments-1.49.1-py3-none-any.whl
          pip install -q -r requirements.lock

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy zarabot

      - name: Tests and coverage
        run: pytest --cov --cov-report=json --cov-report=term-missing

      - name: Per-module coverage floors
        run: python scripts/ci/check_coverage.py

      - name: Docs consistency
        run: |
          python scripts/ci/check_docs.py

      # Issue #118 item 7: AGENTS.md range, sketch dirs, coverage floors.
      # Own step so a red docs gate cannot hide this one under bash -e.
      - name: Rulebook consistency
        run: python scripts/ci/check_rulebook.py

      # §7.1 names one owning module per event. Emitted elsewhere, or missing
      # a required field, and the log stops answering the question it exists for.
      - name: Event emission
        run: python scripts/ci/check_events.py

      # Failure class 8: a latch set and never reset is equivalent to no alert.
      - name: Latch resets
        run: python scripts/ci/check_latches.py

      # Issue #118 item 5: every §3.2 test contract must reach a task file,
      # and every "no test block" claim in a task file must be true. Own step
      # so a red compose or latch gate cannot hide this one under bash -e.
      - name: Test-contract reachability
        run: python scripts/ci/check_test_contracts.py

      # Issue #183: the deployed compose file kept three log files while the
      # brief promised five. Own step — the retained window is the only
      # evidence path the health export has.
      - name: Compose log rotation
        run: python scripts/ci/check_compose.py

      # If tasks/ changes when regenerated, the spec and the tasks an agent is
      # fed have diverged. That divergence is how a spec quietly becomes fiction.
      - name: Spec drift
        run: |
          python scripts/make_tasks.py
          git diff --exit-code tasks/ \
            || { echo "::error::tasks/ is stale — run scripts/make_tasks.py and commit"; exit 1; }

      - name: Image builds
        run: docker build -t zarabot:ci .
