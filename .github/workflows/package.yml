name: Package

# Stage 4. Every green main builds an image and publishes it to GHCR, tagged
# with the commit. The VPS pulls by tag, so a deploy is choosing a tag and a
# rollback is choosing the previous one.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: package
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # Refuse to publish an image from a red tree. Packaging a build that
      # failed its own checks is how a broken image reaches a pull-based
      # deployer that trusts the registry.
      - name: Gate on the full check suite
        run: |
          pip install -q vendor/t_tech_investments-1.49.1-py3-none-any.whl
          pip install -q -r requirements.lock
          ruff check .
          mypy zarabot
          pytest --cov --cov-report=json -q
          python scripts/ci/check_coverage.py
          python scripts/ci/check_docs.py
          python scripts/ci/check_events.py
          python scripts/ci/check_latches.py

      - name: Rulebook consistency
        run: python scripts/ci/check_rulebook.py

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report
        run: |
          printf 'Image published.\n\nProblem: n/a\nWhat was done: built %s\nHow this is prevented: the build gates on the full check suite, so a red tree cannot publish.\n' \
            "${GITHUB_SHA:0:12}" > /tmp/pkg.md
          python scripts/ci/notify.py "Image published" /tmp/pkg.md
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEV_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DEV_TELEGRAM_CHAT_ID }}
