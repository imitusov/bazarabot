# VPS deploy (spec §10). Clone the repo anywhere and run from that directory:
#   mkdir -p data/backups && sudo chown -R 1000:1000 data
#   docker compose up -d --build
# Confirm the Telegram ready alert. No published ports.
#
# Paths are relative to this file: ./.env and ./data → /data in the container.
# DB_PATH=/data/zarabot.db BACKUP_DIR=/data/backups in that env file.
#
# ./data must be owned by uid 1000 before the first start: the container runs as
# a non-root user with that id, a bind mount keeps the host's ownership, and a
# missing source directory is created by Docker owned by root. Getting this
# wrong starts the container cleanly and then fails on the first query with
# "unable to open database file".

services:
  zarabot:
    build: .
    image: zarabot:latest
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Moscow
    volumes:
      - ./data:/data
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # No ports: the container listens on nothing.
